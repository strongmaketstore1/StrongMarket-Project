<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StrongMarket Store</title>
  <style>
    body { font-family: Arial; margin: 0; padding: 0; background: #f5f5f5; }
    header { background: #111; color: white; padding: 20px; text-align: center; }
    .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 30px; }
    .product { background: white; padding: 15px; border-radius: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .product img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
    .btn { background: #ff6600; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
    footer { text-align: center; padding: 20px; background: #111; color: white; margin-top: 30px; }
  </style>
</head>
<body>
  <header>
    <h1>StrongMarket Store</h1>
    <p>Quality Products, Fast Delivery</p>
  </header>

  <div class="products">
    <div class="product">
      <img src="https://via.placeholder.com/300" alt="Product 1">
      <h3>Wireless Headphones</h3>
      <p>$49.99</p>
      <button class="btn">Add to Cart</button>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/300" alt="Product 2">
      <h3>Smart Watch</h3>
      <p>$89.99</p>
      <button class="btn">Add to Cart</button>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/300" alt="Product 3">
      <h3>Bluetooth Speaker</h3>
      <p>$35.99</p>
      <button class="btn">Add to Cart</button>
    </div>
  </div>

  <footer>
    <p>© 2026 StrongMarket Store | Contact: support@strongmarket.com</p>
  </footer>
</body>
</html>
