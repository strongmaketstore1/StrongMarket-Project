<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      const path = location.pathname;
      const repo = "/StrongMarket-Project";

      if (path.startsWith(repo)) {
        sessionStorage.setItem(
          "redirect",
          path + location.search + location.hash
        );
      }

      location.replace(repo + "/");
    </script>
  </head>
  <body></body>
</html>
